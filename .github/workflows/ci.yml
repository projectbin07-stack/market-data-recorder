name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    env:
      # The tickreplay compatibility tests must run, not skip, in CI.
      MDREC_REQUIRE_TICKREPLAY: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Install tickreplay (test-only, pinned tag)
        run: python -m pip install "tickreplay @ git+https://github.com/projectbin07-stack/tickreplay.git@v0.1.0"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type check
        run: mypy
      - name: Test (local fake exchange only, no live network)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=85
      - name: CLI smoke test
        shell: bash
        run: |
          mdrec --version
          mdrec --help
          mdrec verify does-not-exist || test $? -eq 1
