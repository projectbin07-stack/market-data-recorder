[build-system]
requires = ["hatchling>=1.24,<2"]
build-backend = "hatchling.build"

[project]
name = "market-data-recorder"
dynamic = ["version"]
description = "Gap-aware recorder for public market-data WebSocket feeds that writes replayable, validated files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Navaneeth KG" }]
keywords = ["market-data", "websocket", "recorder", "trades", "ohlcv", "binance", "coinbase", "kraken"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]
dependencies = ["websockets>=13.1,<18"]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<3",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[project.scripts]
mdrec = "market_data_recorder.cli:main"

[project.urls]
Homepage = "https://github.com/projectbin07-stack/market-data-recorder"
Issues = "https://github.com/projectbin07-stack/market-data-recorder/issues"
Changelog = "https://github.com/projectbin07-stack/market-data-recorder/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/market_data_recorder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data_recorder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tickreplay", "tickreplay.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["market_data_recorder"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
